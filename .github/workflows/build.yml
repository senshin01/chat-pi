name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ChatPi.Core.Tests/ChatPi.Core.Tests.csproj --locked-mode
      - run: dotnet test tests/ChatPi.Core.Tests/ChatPi.Core.Tests.csproj -c Release --no-restore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ChatPi.sln --locked-mode
      - run: dotnet build ChatPi.sln -c Release --no-restore
      - run: dotnet test tests/ChatPi.Core.Tests/ChatPi.Core.Tests.csproj -c Release --no-build --no-restore
      - run: dotnet test tests/ChatPi.Windows.Tests/ChatPi.Windows.Tests.csproj -c Release --no-build --no-restore
      - name: Package Windows x64 app
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ChatPi-win-x64
          path: artifacts/ChatPi-win-x64.zip
